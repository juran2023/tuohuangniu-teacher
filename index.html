<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深圳拓荒牛 · 数据监控大屏</title>
    <!-- 词云库 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.2/src/wordcloud2.min.js">
    </script>
    <style>
        :root {
            --bg-deep: #060b14;
            --bg-card: rgba(14, 22, 42, 0.85);
            --bg-card-hover: rgba(18, 28, 52, 0.92);
            --border-glow: rgba(0, 180, 216, 0.35);
            --border-bright: rgba(0, 210, 255, 0.6);
            --text-primary: #e8edf5;
            --text-secondary: #a8b8d0;
            --text-muted: #6b7d95;
            --accent-cyan: #00d4ff;
            --accent-gold: #ffc853;
            --accent-green: #00e887;
            --accent-pink: #ff5e8a;
            --accent-purple: #a78bfa;
            --accent-orange: #ff8c52;
            --glow-cyan: 0 0 18px rgba(0, 212, 255, 0.45);
            --glow-gold: 0 0 18px rgba(255, 200, 83, 0.4);
            --glow-green: 0 0 14px rgba(0, 232, 135, 0.4);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', 'Monaco', 'Microsoft YaHei', monospace;
            --font-sans: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-deep);
            font-family: var(--font-sans);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============ Canvas 粒子背景 ============ */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ============ 网格线背景叠加 ============ */
        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(0, 180, 216, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 180, 216, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.5) 0%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.5) 0%, transparent 70%);
        }

        /* ============ 主容器 ============ */
        .dashboard-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 16px 20px 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* ============ 顶部标题栏 ============ */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            padding: 16px 24px;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-glow);
            box-shadow: var(--glow-cyan);
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -30%;
            left: -10%;
            width: 120%;
            height: 160%;
            background: radial-gradient(ellipse at 30% 50%, rgba(0, 180, 216, 0.07) 0%, transparent 65%);
            pointer-events: none;
        }
        .header>* {
            position: relative;
            z-index: 1;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header-icon {
            font-size: 42px;
            animation: gentlePulse 2.5s ease-in-out infinite;
            filter: drop-shadow(0 0 10px rgba(255, 200, 83, 0.5));
        }
        @keyframes gentlePulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.12);
            }
        }
        .header-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ffc853 0%, #ff8c52 30%, #00d4ff 70%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            line-height: 1.2;
        }
        .header-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-green);
            box-shadow: var(--glow-green);
            animation: dotPulse 2s ease-in-out infinite;
        }
        .status-dot.warning {
            background: var(--accent-gold);
            box-shadow: var(--glow-gold);
            animation: dotPulseFast 0.8s ease-in-out infinite;
        }
        .status-dot.error {
            background: #ff4444;
            box-shadow: 0 0 14px rgba(255, 68, 68, 0.5);
            animation: dotPulseFast 0.5s ease-in-out infinite;
        }
        @keyframes dotPulse {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(0, 232, 135, 0.5);
            }
            50% {
                box-shadow: 0 0 22px rgba(0, 232, 135, 0.9);
            }
        }
        @keyframes dotPulseFast {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .countdown-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 180, 216, 0.1);
            border: 1px solid rgba(0, 200, 240, 0.3);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 13px;
            color: var(--accent-cyan);
            font-family: var(--font-mono);
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .countdown-number {
            font-size: 22px;
            font-weight: 700;
            min-width: 32px;
            text-align: center;
            color: #fff;
        }
        .clock-display {
            font-size: 15px;
            font-family: var(--font-mono);
            color: var(--text-secondary);
            letter-spacing: 2px;
            white-space: nowrap;
        }

        /* ============ 主内容区 ============ */
        .main-content {
            display: flex;
            gap: 16px;
            flex: 1;
            min-height: 0;
        }
        @media (max-width: 1100px) {
            .main-content {
                flex-direction: column;
            }
        }

        /* ============ 面板通用样式 ============ */
        .panel {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-glow);
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }
        .panel:hover {
            border-color: var(--border-bright);
            box-shadow: var(--glow-cyan);
        }
        .panel::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 200, 240, 0.5), transparent);
            pointer-events: none;
            opacity: 0.7;
        }
        .panel-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }
        .panel-icon {
            font-size: 22px;
            flex-shrink: 0;
        }
        .panel-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-primary);
            text-transform: uppercase;
            white-space: nowrap;
        }
        .panel-badge {
            margin-left: auto;
            font-size: 11px;
            background: rgba(0, 200, 240, 0.15);
            color: var(--accent-cyan);
            padding: 3px 10px;
            border-radius: 12px;
            letter-spacing: 1px;
            font-family: var(--font-mono);
            white-space: nowrap;
        }
        /* Tab 切换按钮组 */
        .tab-toggle-group {
            display: flex;
            gap: 0;
            margin-left: 12px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(0, 200, 240, 0.25);
            flex-shrink: 0;
        }
        .tab-btn {
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.3s ease;
            white-space: nowrap;
            font-family: var(--font-sans);
            outline: none;
        }
        .tab-btn.active {
            background: rgba(0, 200, 240, 0.2);
            color: #fff;
            box-shadow: inset 0 0 12px rgba(0, 200, 240, 0.15);
        }
        .tab-btn:hover:not(.active) {
            background: rgba(0, 200, 240, 0.08);
            color: var(--text-secondary);
        }
        .panel-body {
            flex: 1;
            overflow-y: auto;
            position: relative;
            z-index: 1;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
            min-height: 0;
        }
        .panel-body::-webkit-scrollbar {
            width: 4px;
        }
        .panel-body::-webkit-scrollbar-track {
            background: transparent;
        }
        .panel-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 4px;
        }

        /* ============ 左栏：提交记录列表 ============ */
        .panel-left {
            flex: 0 0 340px;
            max-height: calc(100vh - 180px);
        }
        @media (max-width: 1100px) {
            .panel-left {
                flex: 0 0 auto;
                max-height: 360px;
            }
        }
        .record-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .record-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.35s ease;
            position: relative;
            cursor: default;
        }
        .record-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(0, 200, 240, 0.3);
            transform: translateX(3px);
        }
        .record-item.new-highlight {
            animation: highlightNew 1.2s ease-out;
        }
        @keyframes highlightNew {
            0% {
                background: rgba(0, 212, 255, 0.2);
                border-color: rgba(0, 212, 255, 0.6);
            }
            100% {
                background: rgba(255, 255, 255, 0.02);
                border-color: rgba(255, 255, 255, 0.04);
            }
        }
        .record-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            color: #fff;
            letter-spacing: 1px;
        }
        .record-info {
            flex: 1;
            min-width: 0;
        }
        .record-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .record-time {
            font-size: 11px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            white-space: nowrap;
        }
        .record-word-badge {
            flex-shrink: 0;
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #fff;
            white-space: nowrap;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 14px;
            letter-spacing: 2px;
        }
        .empty-state .empty-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* ============ 中栏：词频统计 / 词云 ============ */
        .panel-center {
            flex: 1;
            max-height: calc(100vh - 180px);
            min-width: 0;
        }
        @media (max-width: 1100px) {
            .panel-center {
                max-height: 500px;
                min-height: 380px;
            }
        }
        .chart-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .chart-row {
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.4s ease;
        }
        .chart-label {
            flex: 0 0 70px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            text-align: right;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chart-bar-wrap {
            flex: 1;
            height: 28px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            overflow: hidden;
            position: relative;
        }
        .chart-bar {
            height: 100%;
            border-radius: 14px;
            transition: width 0.7s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            position: relative;
            min-width: 28px;
            display: flex;
            align-items: center;
            padding-left: 14px;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 1px;
            white-space: nowrap;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .chart-count {
            flex: 0 0 40px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            text-align: left;
            font-family: var(--font-mono);
            letter-spacing: 1px;
        }
        /* 词云容器 */
        .wordcloud-container {
            width: 100%;
            height: 100%;
            min-height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .wordcloud-container canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            border-radius: var(--radius-sm);
        }
        .wordcloud-empty {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            letter-spacing: 2px;
            pointer-events: none;
        }
        .wordcloud-empty .empty-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* ============ 右栏：统计概览 + 最新提交 ============ */
        .panel-right {
            flex: 0 0 300px;
            max-height: calc(100vh - 180px);
            gap: 14px;
        }
        @media (max-width: 1100px) {
            .panel-right {
                flex: 0 0 auto;
                max-height: none;
                flex-direction: row;
                flex-wrap: wrap;
            }
            .panel-right .stat-cards-grid {
                flex-direction: row;
                flex-wrap: wrap;
            }
        }
        .stat-cards-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            position: relative;
            z-index: 1;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-md);
            padding: 16px 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.35s ease;
        }
        .stat-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(0, 200, 240, 0.25);
        }
        .stat-value {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 2px;
            font-family: var(--font-mono);
            line-height: 1;
            margin-bottom: 4px;
        }
        .stat-value.cyan {
            color: var(--accent-cyan);
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }
        .stat-value.gold {
            color: var(--accent-gold);
            text-shadow: 0 0 20px rgba(255, 200, 83, 0.5);
        }
        .stat-value.green {
            color: var(--accent-green);
            text-shadow: 0 0 20px rgba(0, 232, 135, 0.5);
        }
        .stat-value.pink {
            color: var(--accent-pink);
            text-shadow: 0 0 20px rgba(255, 94, 138, 0.5);
        }
        .stat-label {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .latest-card {
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-md);
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1;
            text-align: center;
            transition: all 0.4s ease;
        }
        .latest-card:hover {
            border-color: rgba(0, 200, 240, 0.3);
        }
        .latest-word {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ffc853, #ff8c52);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .latest-name {
            font-size: 14px;
            color: var(--text-secondary);
            letter-spacing: 2px;
        }
        .latest-time {
            font-size: 11px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            margin-top: 4px;
        }
        .no-latest {
            color: var(--text-muted);
            font-size: 14px;
            letter-spacing: 2px;
        }

        /* ============ 底部状态栏 ============ */
        .footer-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            padding: 10px 20px;
            margin-top: 16px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-glow);
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1px;
            font-family: var(--font-mono);
        }
        .footer-bar .pulse-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent-green);
            margin-right: 6px;
            animation: dotPulse 2s ease-in-out infinite;
            vertical-align: middle;
        }

        /* ============ 响应式微调 ============ */
        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
            }
            .header-title {
                font-size: 20px;
                letter-spacing: 1px;
            }
            .header-icon {
                font-size: 30px;
            }
            .stat-value {
                font-size: 24px;
            }
            .panel {
                padding: 14px 10px;
            }
            .panel-left,
            .panel-center,
            .panel-right {
                flex: 1 1 auto;
                max-height: none;
            }
            .main-content {
                gap: 10px;
            }
            .countdown-badge {
                padding: 6px 10px;
                font-size: 11px;
            }
            .countdown-number {
                font-size: 17px;
                min-width: 24px;
            }
            .chart-label {
                flex: 0 0 50px;
                font-size: 12px;
            }
            .tab-btn {
                padding: 5px 10px;
                font-size: 11px;
            }
            .wordcloud-container {
                min-height: 260px;
            }
        }
    </style>
</head>
<body>

    <!-- Canvas 粒子背景 -->
    <canvas id="particleCanvas"></canvas>

    <!-- 网格线叠加 -->
    <div class="grid-overlay"></div>

    <!-- 主容器 -->
    <div class="dashboard-container">
        <!-- ==================== 顶部标题栏 ==================== -->
        <header class="header">
            <div class="header-left">
                <span class="header-icon">🐂</span>
                <div>
                    <h1 class="header-title">深圳拓荒牛</h1>
                    <p class="header-subtitle">Data Monitoring Dashboard</p>
                </div>
            </div>
            <div class="header-right">
                <span class="clock-display" id="liveClock">--:--:--</span>
                <div class="status-indicator">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">连接中</span>
                </div>
                <div class="countdown-badge">
                    <span>⏳ 下次刷新</span>
                    <span class="countdown-number" id="countdownDisplay">10</span>
                    <span>秒</span>
                </div>
            </div>
        </header>

        <!-- ==================== 主内容区 ==================== -->
        <div class="main-content">
            <!-- 左栏：提交记录列表 -->
            <div class="panel panel-left">
                <div class="panel-header">
                    <span class="panel-icon">📋</span>
                    <span class="panel-title">提交记录</span>
                    <span class="panel-badge" id="recordCount">0 条</span>
                </div>
                <div class="panel-body" id="recordListContainer">
                    <div class="empty-state">
                        <span class="empty-icon">📭</span>
                        <span>暂无提交记录</span>
                        <br>
                        <span style="font-size:11px;">等待数据接入...</span>
                    </div>
                </div>
            </div>

            <!-- 中栏：词频统计 / 词云（Tab切换） -->
            <div class="panel panel-center" id="panelCenter">
                <div class="panel-header">
                    <span class="panel-icon">📊</span>
                    <span class="panel-title">词频统计</span>
                    <!-- Tab切换按钮组 -->
                    <div class="tab-toggle-group" id="tabToggleGroup">
                        <button class="tab-btn active" data-tab="chart" id="tabChartBtn">📊 条形图</button>
                        <button class="tab-btn" data-tab="wordcloud" id="tabWordcloudBtn">☁️ 词云</button>
                    </div>
                    <span class="panel-badge" id="uniqueWordCount">0 种</span>
                </div>
                <div class="panel-body" id="centerPanelBody">
                    <!-- 条形图容器 -->
                    <div id="chartContainer">
                        <div class="empty-state">
                            <span class="empty-icon">📈</span>
                            <span>暂无数据可展示</span>
                        </div>
                    </div>
                    <!-- 词云容器（默认隐藏） -->
                    <div id="wordcloudContainer" class="wordcloud-container" style="display:none;">
                        <canvas id="wordcloudCanvas"></canvas>
                        <div class="wordcloud-empty" id="wordcloudEmpty">
                            <span class="empty-icon">☁️</span>
                            <span>暂无数据可展示</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右栏：统计概览 + 最新提交 -->
            <div class="panel panel-right" style="gap:14px;">
                <div class="panel-header" style="margin-bottom:0;">
                    <span class="panel-icon">🏆</span>
                    <span class="panel-title">统计概览</span>
                </div>
                <div class="stat-cards-grid">
                    <div class="stat-card">
                        <div class="stat-value cyan" id="statTotal">0</div>
                        <div class="stat-label">总提交数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value gold" id="statPeople">0</div>
                        <div class="stat-label">参与人数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value green" id="statUniqueWords">0</div>
                        <div class="stat-label">词语种类</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value pink" id="statToday">0</div>
                        <div class="stat-label">今日提交</div>
                    </div>
                </div>
                <!-- 最新提交 -->
                <div class="latest-card" id="latestCard">
                    <div style="font-size:11px;color:var(--text-muted);letter-spacing:2px;margin-bottom:6px;">🕐 最新提交</div>
                    <div class="latest-word" id="latestWord">--</div>
                    <div class="latest-name" id="latestName">--</div>
                    <div class="latest-time" id="latestTime">--</div>
                </div>
            </div>
        </div>

        <!-- ==================== 底部状态栏 ==================== -->
        <div class="footer-bar">
            <span><span class="pulse-dot"></span>系统运行中 · 数据每10秒自动刷新</span>
            <span>数据来源: quickform.cn/api/8qy6sjw6vp/all</span>
            <span id="lastUpdateTime">最后更新: --</span>
        </div>
    </div>

    <script>
        (function() {
            // ==================== DOM 元素 ====================
            const recordListContainer = document.getElementById('recordListContainer');
            const chartContainer = document.getElementById('chartContainer');
            const wordcloudContainer = document.getElementById('wordcloudContainer');
            const wordcloudCanvas = document.getElementById('wordcloudCanvas');
            const wordcloudEmpty = document.getElementById('wordcloudEmpty');
            const recordCountBadge = document.getElementById('recordCount');
            const uniqueWordCountBadge = document.getElementById('uniqueWordCount');
            const statTotal = document.getElementById('statTotal');
            const statPeople = document.getElementById('statPeople');
            const statUniqueWords = document.getElementById('statUniqueWords');
            const statToday = document.getElementById('statToday');
            const latestWord = document.getElementById('latestWord');
            const latestName = document.getElementById('latestName');
            const latestTime = document.getElementById('latestTime');
            const countdownDisplay = document.getElementById('countdownDisplay');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const liveClock = document.getElementById('liveClock');
            const lastUpdateTime = document.getElementById('lastUpdateTime');
            const latestCard = document.getElementById('latestCard');
            const tabChartBtn = document.getElementById('tabChartBtn');
            const tabWordcloudBtn = document.getElementById('tabWordcloudBtn');
            const centerPanelBody = document.getElementById('centerPanelBody');

            // ==================== 状态变量 ====================
            let allSubmissions = [];
            let totalSubmissions = 0;
            let previousSubmissionCount = 0;
            let countdownSeconds = 10;
            let activeCenterTab = 'chart'; // 'chart' 或 'wordcloud'
            let wordcloudNeedsRedraw = true; // 词云是否需要重绘
            const REFRESH_INTERVAL = 10000; // 10秒

            // ==================== 头像颜色生成 ====================
            const avatarColors = [
                '#ff6b6b', '#ff8c52', '#ffc853', '#06d6a0', '#00b4d8',
                '#118ab2', '#a78bfa', '#ef476f', '#f78c6b', '#5e60ce',
                '#48cae4', '#0077b6', '#e36414', '#9b5de5', '#00bbf9',
            ];

            function getAvatarColor(name) {
                if (!name) return avatarColors[0];
                let hash = 0;
                for (let i = 0; i < name.length; i++) {
                    hash = name.charCodeAt(i) + ((hash << 5) - hash);
                }
                return avatarColors[Math.abs(hash) % avatarColors.length];
            }

            function getInitial(name) {
                if (!name || name.trim().length === 0) return '?';
                return name.trim().charAt(0).toUpperCase();
            }

            // ==================== 词频统计颜色 ====================
            const chartBarColors = [
                'linear-gradient(135deg, #ff6b6b, #ff8c52)',
                'linear-gradient(135deg, #ffc853, #f7a641)',
                'linear-gradient(135deg, #06d6a0, #00b4d8)',
                'linear-gradient(135deg, #118ab2, #48cae4)',
                'linear-gradient(135deg, #a78bfa, #7c5ce7)',
                'linear-gradient(135deg, #ef476f, #ff5e8a)',
                'linear-gradient(135deg, #5e60ce, #9b5de5)',
                'linear-gradient(135deg, #e36414, #f78c6b)',
                'linear-gradient(135deg, #0077b6, #00bbf9)',
                'linear-gradient(135deg, #00b4d8, #06d6a0)',
                'linear-gradient(135deg, #ff8c52, #ff6b6b)',
                'linear-gradient(135deg, #48cae4, #a78bfa)',
                'linear-gradient(135deg, #f78c6b, #ef476f)',
                'linear-gradient(135deg, #9b5de5, #5e60ce)',
                'linear-gradient(135deg, #00bbf9, #118ab2)',
            ];

            function getChartColor(index) {
                return chartBarColors[index % chartBarColors.length];
            }

            // 词云专用颜色（明亮活泼，适合深色背景）
            const wordCloudColors = [
                '#ff6b6b', '#ff8c52', '#ffc853', '#06d6a0', '#00d4ff',
                '#48cae4', '#a78bfa', '#ff5e8a', '#f78c6b', '#ff9f43',
                '#00e887', '#e36414', '#9b5de5', '#00bbf9', '#ffb347',
                '#7bed9f', '#70a1ff', '#ff6348', '#2ed573', '#ffa502',
            ];

            // ==================== 时间格式化 ====================
            function formatTime(isoString) {
                if (!isoString) return '--';
                try {
                    const date = new Date(isoString);
                    const now = new Date();
                    const diffMs = now - date;
                    const diffSec = Math.floor(diffMs / 1000);
                    const diffMin = Math.floor(diffSec / 60);
                    const diffHour = Math.floor(diffMin / 60);

                    if (diffSec < 60) return '刚刚';
                    if (diffMin < 60) return `${diffMin} 分钟前`;
                    if (diffHour < 24) return `${diffHour} 小时前`;

                    const month = date.getMonth() + 1;
                    const day = date.getDate();
                    const hours = String(date.getHours()).padStart(2, '0');
                    const minutes = String(date.getMinutes()).padStart(2, '0');
                    const seconds = String(date.getSeconds()).padStart(2, '0');
                    return `${month}月${day}日 ${hours}:${minutes}:${seconds}`;
                } catch {
                    return isoString;
                }
            }

            function formatFullTime(isoString) {
                if (!isoString) return '--';
                try {
                    const date = new Date(isoString);
                    const y = date.getFullYear();
                    const m = String(date.getMonth() + 1).padStart(2, '0');
                    const d = String(date.getDate()).padStart(2, '0');
                    const h = String(date.getHours()).padStart(2, '0');
                    const min = String(date.getMinutes()).padStart(2, '0');
                    const s = String(date.getSeconds()).padStart(2, '0');
                    return `${y}-${m}-${d} ${h}:${min}:${s}`;
                } catch {
                    return isoString;
                }
            }

            function isToday(isoString) {
                if (!isoString) return false;
                try {
                    const date = new Date(isoString);
                    const now = new Date();
                    return date.getFullYear() === now.getFullYear() &&
                        date.getMonth() === now.getMonth() &&
                        date.getDate() === now.getDate();
                } catch {
                    return false;
                }
            }

            // ==================== 数据获取 ====================
            async function fetchData() {
                const response = await fetch('https://quickform.cn/api/8qy6sjw6vp/all', {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                    },
                });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                const data = await response.json();
                return data;
            }

            // ==================== 处理数据 ====================
            function processData(data) {
                totalSubmissions = data.total_submissions || 0;
                const submissions = data.submissions || [];

                // 按时间戳排序（最新的在前）
                const sorted = [...submissions].sort((a, b) => {
                    const timeA = new Date(a.timestamp || 0).getTime();
                    const timeB = new Date(b.timestamp || 0).getTime();
                    return timeB - timeA;
                });

                allSubmissions = sorted;
            }

            function getWordFrequency() {
                const freqMap = {};
                allSubmissions.forEach(sub => {
                    const word = (sub.word || '').trim();
                    if (word) {
                        freqMap[word] = (freqMap[word] || 0) + 1;
                    }
                });
                // 按频率降序排列
                const sorted = Object.entries(freqMap).sort((a, b) => b[1] - a[1]);
                return sorted.slice(0, 15); // Top 15
            }

            function getAllWordFrequency() {
                const freqMap = {};
                allSubmissions.forEach(sub => {
                    const word = (sub.word || '').trim();
                    if (word) {
                        freqMap[word] = (freqMap[word] || 0) + 1;
                    }
                });
                // 按频率降序排列，返回全部
                return Object.entries(freqMap).sort((a, b) => b[1] - a[1]);
            }

            function getUniquePeopleCount() {
                const names = new Set();
                allSubmissions.forEach(sub => {
                    const name = (sub.name || '').trim();
                    if (name) names.add(name);
                });
                return names.size;
            }

            function getUniqueWordCount() {
                const words = new Set();
                allSubmissions.forEach(sub => {
                    const word = (sub.word || '').trim();
                    if (word) words.add(word);
                });
                return words.size;
            }

            function getTodayCount() {
                return allSubmissions.filter(sub => isToday(sub.timestamp)).length;
            }

            function getLatestSubmission() {
                if (allSubmissions.length === 0) return null;
                return allSubmissions[0];
            }

            // ==================== 渲染：记录列表 ====================
            function renderRecordList() {
                if (allSubmissions.length === 0) {
                    recordListContainer.innerHTML = `
                            <div class="empty-state">
                                <span class="empty-icon">📭</span>
                                <span>暂无提交记录</span>
                                <br><span style="font-size:11px;">等待数据接入...</span>
                            </div>`;
                    recordCountBadge.textContent = '0 条';
                    return;
                }
                recordCountBadge.textContent = `${allSubmissions.length} 条`;

                const listHtml = allSubmissions.map((sub, index) => {
                    const name = (sub.name || '匿名').trim();
                    const word = (sub.word || '--').trim();
                    const time = sub.timestamp || '';
                    const avatarColor = getAvatarColor(name);
                    const initial = getInitial(name);
                    const displayTime = formatTime(time);

                    return `
                            <li class="record-item" data-index="${index}">
                                <div class="record-avatar" style="background:${avatarColor};">${initial}</div>
                                <div class="record-info">
                                    <div class="record-name" title="${escapeHtml(name)}">${escapeHtml(name)}</div>
                                    <div class="record-time">${escapeHtml(displayTime)}</div>
                                </div>
                                <span class="record-word-badge" style="background:${getAvatarColor(word)};">${escapeHtml(word)}</span>
                            </li>`;
                }).join('');

                recordListContainer.innerHTML = `<ul class="record-list">${listHtml}</ul>`;

                // 高亮新记录
                if (previousSubmissionCount > 0 && allSubmissions.length > previousSubmissionCount) {
                    const newCount = allSubmissions.length - previousSubmissionCount;
                    const items = recordListContainer.querySelectorAll('.record-item');
                    for (let i = 0; i < Math.min(newCount, items.length); i++) {
                        items[i].classList.add('new-highlight');
                    }
                }
            }

            // ==================== 渲染：条形图 ====================
            function renderChart() {
                const wordFreq = getWordFrequency();
                uniqueWordCountBadge.textContent = `${getUniqueWordCount()} 种`;

                if (wordFreq.length === 0) {
                    chartContainer.innerHTML = `
                            <div class="empty-state">
                                <span class="empty-icon">📈</span>
                                <span>暂无数据可展示</span>
                            </div>`;
                    chartContainer.style.display = 'block';
                    return;
                }

                const maxCount = wordFreq[0][1];
                const chartHtml = wordFreq.map((entry, index) => {
                    const [word, count] = entry;
                    const percentage = maxCount > 0 ? (count / maxCount) * 100 : 0;
                    const barColor = getChartColor(index);
                    return `
                            <div class="chart-row">
                                <span class="chart-label" title="${escapeHtml(word)}">${escapeHtml(word)}</span>
                                <div class="chart-bar-wrap">
                                    <div class="chart-bar" style="width:${Math.max(percentage, 3)}%;background:${barColor};">
                                        ${percentage >= 18 ? escapeHtml(word) : ''}
                                    </div>
                                </div>
                                <span class="chart-count">${count}</span>
                            </div>`;
                }).join('');
                chartContainer.innerHTML = `<div class="chart-area">${chartHtml}</div>`;
                chartContainer.style.display = 'block';
            }

            // ==================== 渲染：词云 ====================
            function drawWordCloud() {
                const allWordFreq = getAllWordFrequency();

                // 检查词云库是否可用
                if (typeof WordCloud === 'undefined') {
                    wordcloudEmpty.innerHTML =
                        '<span class="empty-icon">⚠️</span><span>词云库加载中，请稍候...</span>';
                    wordcloudEmpty.style.display = 'block';
                    wordcloudCanvas.style.display = 'none';
                    return;
                }

                if (allWordFreq.length === 0) {
                    wordcloudEmpty.innerHTML =
                        '<span class="empty-icon">☁️</span><span>暂无数据可展示</span>';
                    wordcloudEmpty.style.display = 'block';
                    wordcloudCanvas.style.display = 'none';
                    return;
                }

                // 隐藏空状态，显示Canvas
                wordcloudEmpty.style.display = 'none';
                wordcloudCanvas.style.display = 'block';

                // 获取容器尺寸
                const containerWidth = wordcloudContainer.clientWidth;
                const containerHeight = wordcloudContainer.clientHeight;
                const canvasWidth = Math.max(containerWidth - 16, 300);
                const canvasHeight = Math.max(containerHeight - 16, 320);

                // 设置Canvas像素尺寸
                wordcloudCanvas.width = canvasWidth;
                wordcloudCanvas.height = canvasHeight;
                wordcloudCanvas.style.width = canvasWidth + 'px';
                wordcloudCanvas.style.height = canvasHeight + 'px';

                // 计算weightFactor
                const maxWeight = allWordFreq[0][1];
                const weightFactor = Math.max(8, Math.min(55, Math.floor(280 / Math.max(maxWeight, 1))));

                // 准备词云数据 [word, weight]
                const list = allWordFreq.map(([word, count]) => [word, count]);

                try {
                    WordCloud(wordcloudCanvas, {
                        list: list,
                        gridSize: Math.max(8, Math.floor(canvasWidth / 55)),
                        weightFactor: weightFactor,
                        fontFamily: "'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif",
                        color: function(word, weight) {
                            // 根据权重从颜色数组中选取
                            const idx = Math.floor(weight * 1.7) % wordCloudColors.length;
                            return wordCloudColors[Math.abs(idx)];
                        },
                        rotateRatio: 0.25,
                        minRotation: -0.35,
                        maxRotation: 0.35,
                        minSize: 10,
                        backgroundColor: 'transparent',
                        shuffle: true,
                        shape: 'circle',
                        ellipticity: 0.75,
                        clearCanvas: true,
                        hover: function(item, dimension, event) {
                            // 鼠标悬停时改变光标
                            if (item) {
                                wordcloudCanvas.style.cursor = 'pointer';
                            } else {
                                wordcloudCanvas.style.cursor = 'default';
                            }
                        },
                    });
                    wordcloudNeedsRedraw = false;
                } catch (err) {
                    console.error('词云绘制失败:', err);
                    wordcloudEmpty.innerHTML =
                        '<span class="empty-icon">⚠️</span><span>词云绘制异常</span>';
                    wordcloudEmpty.style.display = 'block';
                    wordcloudCanvas.style.display = 'none';
                }
            }

            // ==================== 渲染：统计卡片 ====================
            function renderStats() {
                const total = totalSubmissions;
                const people = getUniquePeopleCount();
                const uniqueWords = getUniqueWordCount();
                const today = getTodayCount();
                const latest = getLatestSubmission();

                animateNumber(statTotal, total);
                animateNumber(statPeople, people);
                animateNumber(statUniqueWords, uniqueWords);
                animateNumber(statToday, today);

                if (latest) {
                    const word = (latest.word || '--').trim();
                    const name = (latest.name || '匿名').trim();
                    const time = latest.timestamp || '';
                    latestWord.textContent = word;
                    latestName.textContent = `— ${name}`;
                    latestTime.textContent = formatFullTime(time);
                    latestCard.style.opacity = '1';
                } else {
                    latestWord.textContent = '--';
                    latestName.textContent = '暂无提交';
                    latestTime.textContent = '--';
                }
            }

            function animateNumber(element, targetValue) {
                const currentText = element.textContent;
                const currentValue = parseInt(currentText, 10);
                if (isNaN(currentValue) || currentValue === targetValue) {
                    element.textContent = targetValue;
                    return;
                }
                const diff = targetValue - currentValue;
                const duration = 500;
                const startTime = performance.now();

                function step(timestamp) {
                    const elapsed = timestamp - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = 1 - Math.pow(1 - progress, 3);
                    const current = Math.round(currentValue + diff * eased);
                    element.textContent = current;
                    if (progress < 1) {
                        requestAnimationFrame(step);
                    } else {
                        element.textContent = targetValue;
                    }
                }
                requestAnimationFrame(step);
            }

            // ==================== 切换Tab ====================
            function switchTab(tabName) {
                if (activeCenterTab === tabName) return;
                activeCenterTab = tabName;

                // 更新按钮状态
                tabChartBtn.classList.remove('active');
                tabWordcloudBtn.classList.remove('active');

                if (tabName === 'chart') {
                    tabChartBtn.classList.add('active');
                    chartContainer.style.display = 'block';
                    wordcloudContainer.style.display = 'none';
                } else {
                    tabWordcloudBtn.classList.add('active');
                    chartContainer.style.display = 'none';
                    wordcloudContainer.style.display = 'flex';
                    // 切换到词云时，延迟一帧绘制（确保容器可见且有尺寸）
                    wordcloudNeedsRedraw = true;
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            drawWordCloud();
                        });
                    });
                }
            }

            // ==================== 总渲染 ====================
            function renderAll() {
                renderRecordList();
                // 根据当前激活的Tab渲染对应视图
                if (activeCenterTab === 'chart') {
                    renderChart();
                } else {
                    // 词云Tab激活时，标记需要重绘
                    wordcloudNeedsRedraw = true;
                    if (wordcloudContainer.style.display !== 'none') {
                        requestAnimationFrame(() => {
                            drawWordCloud();
                        });
                    }
                }
                renderStats();
                uniqueWordCountBadge.textContent = `${getUniqueWordCount()} 种`;
                lastUpdateTime.textContent = `最后更新: ${formatFullTime(new Date().toISOString())}`;
            }

            // ==================== HTML 转义 ====================
            function escapeHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            // ==================== 状态指示器 ====================
            function setStatus(state) {
                statusDot.classList.remove('warning', 'error');
                switch (state) {
                    case 'online':
                        statusDot.classList.remove('warning', 'error');
                        statusText.textContent = '在线';
                        statusDot.style.background = 'var(--accent-green)';
                        statusDot.style.boxShadow = 'var(--glow-green)';
                        break;
                    case 'loading':
                        statusDot.classList.add('warning');
                        statusText.textContent = '刷新中';
                        statusDot.style.background = 'var(--accent-gold)';
                        statusDot.style.boxShadow = 'var(--glow-gold)';
                        break;
                    case 'error':
                        statusDot.classList.add('error');
                        statusText.textContent = '连接失败';
                        statusDot.style.background = '#ff4444';
                        statusDot.style.boxShadow = '0 0 14px rgba(255,68,68,0.5)';
                        break;
                }
            }

            // ==================== 主刷新逻辑 ====================
            async function refreshData() {
                setStatus('loading');
                try {
                    const data = await fetchData();
                    previousSubmissionCount = allSubmissions.length;
                    processData(data);
                    renderAll();
                    setStatus('online');
                    countdownSeconds = 10;
                    countdownDisplay.textContent = countdownSeconds;
                } catch (error) {
                    console.error('数据获取失败:', error);
                    setStatus('error');
                    lastUpdateTime.textContent = `获取失败: ${formatFullTime(new Date().toISOString())}`;
                }
            }

            // ==================== 倒计时 ====================
            function startCountdown() {
                setInterval(() => {
                    countdownSeconds--;
                    if (countdownSeconds <= 0) {
                        countdownSeconds = 10;
                    }
                    countdownDisplay.textContent = countdownSeconds;
                }, 1000);
            }

            // ==================== 实时时钟 ====================
            function updateClock() {
                const now = new Date();
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');
                liveClock.textContent = `${h}:${m}:${s}`;
            }

            // ==================== Canvas 粒子背景 ====================
            function initParticleCanvas() {
                const canvas = document.getElementById('particleCanvas');
                const ctx = canvas.getContext('2d');
                let width, height;
                const particles = [];
                const particleCount = 60;

                function resize() {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                }
                resize();
                window.addEventListener('resize', () => {
                    resize();
                    particles.forEach(p => {
                        p.x = Math.random() * width;
                        p.y = Math.random() * height;
                    });
                });

                for (let i = 0; i < particleCount; i++) {
                    particles.push({
                        x: Math.random() * width,
                        y: Math.random() * height,
                        vx: (Math.random() - 0.5) * 0.35,
                        vy: (Math.random() - 0.5) * 0.35,
                        radius: Math.random() * 1.8 + 0.6,
                        alpha: Math.random() * 0.5 + 0.25,
                        alphaSpeed: (Math.random() - 0.5) * 0.006,
                    });
                }

                function draw() {
                    ctx.clearRect(0, 0, width, height);
                    particles.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.alpha += p.alphaSpeed;
                        if (p.x < 0) { p.x = 0;
                            p.vx *= -1; }
                        if (p.x > width) { p.x = width;
                            p.vx *= -1; }
                        if (p.y < 0) { p.y = 0;
                            p.vy *= -1; }
                        if (p.y > height) { p.y = height;
                            p.vy *= -1; }
                        if (p.alpha > 0.7) { p.alpha = 0.7;
                            p.alphaSpeed *= -1; }
                        if (p.alpha < 0.15) { p.alpha = 0.15;
                            p.alphaSpeed *= -1; }
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(0, 200, 240, ${p.alpha})`;
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.radius * 2.5, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(0, 200, 240, ${p.alpha * 0.15})`;
                        ctx.fill();
                    });
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx * dx + dy * dy);
                            if (dist < 120) {
                                const lineAlpha = (1 - dist / 120) * 0.12;
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = `rgba(0, 180, 220, ${lineAlpha})`;
                                ctx.lineWidth = 0.5;
                                ctx.stroke();
                            }
                        }
                    }
                    requestAnimationFrame(draw);
                }
                draw();
            }

            // ==================== 窗口大小调整时重绘词云 ====================
            let resizeDebounceTimer = null;
            function handleResize() {
                clearTimeout(resizeDebounceTimer);
                resizeDebounceTimer = setTimeout(() => {
                    if (activeCenterTab === 'wordcloud' && wordcloudContainer.style.display !== 'none') {
                        wordcloudNeedsRedraw = true;
                        requestAnimationFrame(() => {
                            drawWordCloud();
                        });
                    }
                }, 400);
            }

            // ==================== 初始化 ====================
            async function init() {
                initParticleCanvas();
                updateClock();
                setInterval(updateClock, 1000);
                startCountdown();

                // 监听窗口大小变化
                window.addEventListener('resize', handleResize);

                // Tab切换事件
                tabChartBtn.addEventListener('click', () => switchTab('chart'));
                tabWordcloudBtn.addEventListener('click', () => switchTab('wordcloud'));

                // 首次加载
                setStatus('loading');
                try {
                    const data = await fetchData();
                    processData(data);
                    renderAll();
                    setStatus('online');
                    countdownSeconds = 10;
                    countdownDisplay.textContent = countdownSeconds;
                } catch (error) {
                    console.error('首次数据加载失败:', error);
                    setStatus('error');
                    lastUpdateTime.textContent = `加载失败: ${formatFullTime(new Date().toISOString())}`;
                }

                // 定时刷新
                setInterval(() => {
                    refreshData();
                }, REFRESH_INTERVAL);

                console.log('🐂 深圳拓荒牛 · 数据大屏已就绪（含词云统计）');
            }

            // 启动
            init();
        })();
    </script>
</body>
